services:
  postgres:
    image: postgres:16-alpine
    container_name: delson_ps_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: delson
      POSTGRES_PASSWORD: delson_dev_password
      POSTGRES_DB: delson_ps
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delson -d delson_ps"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
