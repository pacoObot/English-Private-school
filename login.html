<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso | Delson PS Maputo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* Efeito de ícones coloridos ao fundo */
        .floating-icon {
            position: absolute;
            z-index: 0;
            user-select: none;
            pointer-events: none;
            opacity: 0.1;
            /* Suave mas visível */
        }

        .icon-red {
            color: #dc2626;
        }

        .icon-blue {
            color: #1e3a8a;
        }

        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 10;
        }

        .input-group:focus-within label {
            color: #1e3a8a;
            transform: translateY(-2px);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(30, 58, 138, 0.4);
        }

        /* Logótipo de Comunicação e Ensino */
        .logo-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
        }

        .logo-main {
            width: 100%;
            height: 100%;
            background: #dc2626;
            /* Vermelho */
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 42px;
            position: relative;
            z-index: 2;
            box-shadow: 0 20px 40px -10px rgba(220, 38, 38, 0.4);
            animation: float 6s ease-in-out infinite;
        }

        .logo-bubble {
            position: absolute;
            background: #1e3a8a;
            /* Azul */
            width: 45px;
            height: 45px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            bottom: -5px;
            right: -5px;
            z-index: 3;
            border: 4px solid #fff;
            animation: float-reverse 5s ease-in-out infinite;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-10px) rotate(2deg);
            }
        }

        @keyframes float-reverse {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(6px) scale(1.1);
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

    <!-- Ícones flutuantes decorativos (Red & Blue) -->
    <i class="fas fa-comment-medical floating-icon icon-red text-7xl"
        style="top: 10%; left: 8%; transform: rotate(-15deg);"></i>
    <i class="fas fa-paper-plane floating-icon icon-blue text-8xl"
        style="bottom: 12%; right: 7%; transform: rotate(15deg);"></i>
    <i class="fas fa-comments floating-icon icon-blue text-6xl"
        style="top: 25%; right: 12%; transform: rotate(10deg);"></i>
    <i class="fas fa-quote-right floating-icon icon-red text-9xl"
        style="bottom: 18%; left: 5%; transform: rotate(-10deg);"></i>
    <i class="fas fa-headset floating-icon icon-blue text-5xl" style="top: 55%; left: 3%;"></i>
    <i class="fas fa-message floating-icon icon-red text-5xl" style="top: 40%; right: 4%;"></i>

    <div class="w-full max-w-[440px] animate-fade-in">

        <!-- Header Visual -->
        <div class="text-center mb-6 relative">
            <div class="logo-container">
                <div class="logo-main">
                    <i class="fas fa-language"></i>
                </div>
                <!-- Bolha com ícone de chat/comunicação -->
                <div class="logo-bubble">
                    <i class="fas fa-comments"></i>
                </div>
            </div>

            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tighter uppercase leading-none">Delson<span
                    class="text-blue-900">PS</span></h1>
            <p class="text-[11px] font-black text-slate-800 uppercase tracking-[0.2em] mt-2">Delson Private School</p>
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-[0.3em] mt-1">Maputo · Mozambique</p>
        </div>

        <!-- Login Form Card -->
        <div class="login-card rounded-[3rem] p-10 border border-slate-100">
            <div class="mb-10 text-center sm:text-left">
                <h2 class="text-xl font-black text-slate-800">Login</h2>
                <div class="h-1.5 w-12 bg-red-600 rounded-full mt-2 mx-auto sm:mx-0"></div>
            </div>

            <form action="#" class="space-y-7">
                <!-- Identificação -->
                <div class="space-y-2 input-group">
                    <label
                        class="text-[10px] font-black text-slate-400 uppercase ml-2 tracking-widest transition-all">Identificação</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-slate-300 group-focus-within:text-blue-900 transition-colors">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <input type="text" required placeholder="Utilizador ou E-mail"
                            class="w-full bg-slate-50 border-2 border-slate-50 rounded-[1.5rem] pl-12 pr-6 py-4 text-sm outline-none transition-all focus:bg-white focus:border-blue-900 font-bold text-slate-700">
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-2 input-group">
                    <div class="flex justify-between items-center px-2">
                        <label
                            class="text-[10px] font-black text-slate-400 uppercase tracking-widest transition-all">Senha</label>
                        <a href="#"
                            class="text-[9px] font-black text-red-600 uppercase tracking-widest hover:underline">Esqueci-me</a>
                    </div>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-slate-300 group-focus-within:text-blue-900 transition-colors">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" required placeholder="••••••••••••"
                            class="w-full bg-slate-50 border-2 border-slate-50 rounded-[1.5rem] pl-12 pr-6 py-4 text-sm outline-none transition-all focus:bg-white focus:border-blue-900 font-bold text-slate-700">
                    </div>
                </div>

                <!-- Ações -->
                <div class="pt-2">
                    <button type="submit"
                        class="w-full btn-gradient text-white font-black text-[11px] uppercase tracking-[0.3em] py-5 rounded-[1.5rem] flex items-center justify-center gap-3">
                        Aceder ao Sistema
                        <i class="fas fa-chevron-right text-[10px]"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- Language Selector -->
        <div class="mt-8 flex flex-col items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="flex gap-2">
                    <button
                        class="px-5 py-2 rounded-full border-2 border-blue-900 flex items-center gap-2 bg-white shadow-sm transition-all group">
                        <img src="https://flagcdn.com/w40/pt.png" class="w-4 h-auto rounded-xs" alt="PT">
                        <span class="text-[10px] font-black text-blue-900">PT</span>
                    </button>
                    <button
                        class="px-5 py-2 rounded-full border-2 border-slate-100 flex items-center gap-2 bg-white shadow-sm hover:border-red-600 transition-all group">
                        <img src="https://flagcdn.com/w40/gb.png"
                            class="w-4 h-auto rounded-xs grayscale group-hover:grayscale-0 transition-all" alt="EN">
                        <span class="text-[10px] font-black text-slate-400 group-hover:text-red-600">EN</span>
                    </button>
                </div>
            </div>

            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[0.2em] text-center leading-relaxed">
                © 2024 Delson PS Ecosystem<br>
                <span class="text-slate-200">Maputo Management Hub</span>
            </p>
        </div>
    </div>

</body>

</html>
